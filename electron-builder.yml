appId: com.entryhive.app
productName: Entry Hive
directories:
  output: dist_electron
  buildResources: build
files:
  - dist/**/*
  - electron/**/*
  - package.json
win:
  target: 
    - nsis
    - portable
  icon: public/logo.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Entry Hive"
  artifactName: "NAT-Prep-Setup.exe"
  uninstallDisplayName: "Entry Hive"
  runAfterFinish: true
